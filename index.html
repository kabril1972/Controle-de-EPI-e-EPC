<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de EPI/EPC Simplificado</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <script>
        // Função para calcular a próxima troca automaticamente ao mudar as datas
        function calcularProximaTroca() {
            const entrada = document.getElementById('dataEntrada').value;
            const vencimento = document.getElementById('dataVencimento').value;
            const textoTroca = document.getElementById('proximaTrocaTexto');
            const containerTroca = document.getElementById('containerTroca');

            if (!entrada || !vencimento) {
                textoTroca.innerText = "Preencha as duas datas...";
                textoTroca.removeAttribute('data-value');
                containerTroca.className = "bg-amber-50 border border-amber-200 p-3 rounded-xl text-center";
                return;
            }

            const pEntrada = entrada.split('-');
            const dEntrada = new Date(parseInt(pEntrada[0]), parseInt(pEntrada[1]) - 1, parseInt(pEntrada[2]));
            
            const pVencimento = vencimento.split('-');
            const dVencimento = new Date(parseInt(pVencimento[0]), parseInt(pVencimento[1]) - 1, parseInt(pVencimento[2]));

            const diferencaDias = Math.ceil((dVencimento.getTime() - dEntrada.getTime()) / (1000 * 60 * 60 * 24));

            if (diferencaDias < 0) {
                textoTroca.innerText = "Erro: Vencimento antes da entrada!";
                textoTroca.removeAttribute('data-value');
                containerTroca.className = "bg-rose-50 border border-rose-300 p-3 rounded-xl text-center text-rose-700 font-bold";
                return;
            }

            const dia = String(dVencimento.getDate()).padStart(2, '0');
            const mes = String(dVencimento.getMonth() + 1).padStart(2, '0');
            const ano = dVencimento.getFullYear();

            textoTroca.innerText = `${dia}/${mes}/${ano} (Em ${diferencaDias} dias)`;
            textoTroca.setAttribute('data-value', `${dia}/${mes}/${ano}`);

            // Alerta visual se estiver perto de vencer (7 dias ou menos)
            if (diferencaDias <= 7) {
                containerTroca.className = "bg-rose-50 border border-rose-400 p-3 rounded-xl text-center text-rose-900 font-black animate-pulse";
            } else {
                containerTroca.className = "bg-amber-50 border border-amber-200 p-3 rounded-xl text-center text-amber-950 font-bold";
            }
        }

        // Função para salvar o item no celular
        function salvarItem(event) {
            event.preventDefault();

            const nome = document.getElementById('nome').value;
            const tipo = document.getElementById('tipo').value;
            const quantidade = document.getElementById('quantidade').value;
            const entrada = document.getElementById('dataEntrada').value;
            const vencimento = document.getElementById('dataVencimento').value;
            const proximaTroca = document.getElementById('proximaTrocaTexto').getAttribute('data-value');

            if (!proximaTroca) {
                alert("Por favor, preencha as datas corretamente.");
                return;
            }

            const dataEntradaBR = entrada.split('-').reverse().join('/');
            const dataVencimentoBR = vencimento.split('-').reverse().join('/');

            const novoItem = {
                id: Date.now(),
                nome: nome,
                tipo: tipo,
                quantidade: quantidade,
                entrada: dataEntradaBR,
                vencimento: dataVencimentoBR,
                proximaTroca: proximaTroca
            };

            // Armazenamento limpo e seguro
            let lista = JSON.parse(localStorage.getItem('banco_seguro_final')) || [];
            lista.unshift(novoItem);

            localStorage.setItem('banco_seguro_final', JSON.stringify(lista));

            // Reseta o formulário com segurança
            document.getElementById('formEpi').reset();
            const textoTroca = document.getElementById('proximaTrocaTexto');
            textoTroca.innerText = "Preencha as duas datas...";
            textoTroca.removeAttribute('data-value');
            document.getElementById('containerTroca').className = "bg-amber-50 border border-amber-200 p-3 rounded-xl text-center";

            // Recarrega a lista atualizada na tela
            renderizarLista();
        }

        // Função para apagar um item cadastrado
        function excluirItem(id) {
            let lista = JSON.parse(localStorage.getItem('banco_seguro_final')) || [];
            lista = lista.filter(item => item.id !== id);
            localStorage.setItem('banco_seguro_final', JSON.stringify(lista));
            renderizarLista();
        }

        // Função para construir a listagem na tela de forma ultra segura
        function renderizarLista() {
            const container = document.getElementById('listaItens');
            if (!container) return; // Segurança extra para evitar erros no console

            const lista = JSON.parse(localStorage.getItem('banco_seguro_final')) || [];

            if (lista.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 text-sm py-8">Nenhum item cadastrado ainda.</p>`;
                return;
            }

            container.innerHTML = lista.map(item => `
                <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-xs relative flex flex-col justify-between">
                    <div>
                        <div class="flex items-center gap-2 mb-1.5">
                            <span class="text-[10px] font-black px-2 py-0.5 rounded ${item.tipo === 'EPI' ? 'bg-teal-100 text-teal-800' : 'bg-purple-100 text-purple-800'}">${item.tipo}</span>
                            <h3 class="font-bold text-gray-800 text-base truncate pr-14">${item.nome}</h3>
                        </div>
                        
                        <p class="text-xs text-gray-600">Quantidade: <span class="font-semibold text-gray-900">${item.quantidade}</span></p>
                        
                        <div class="grid grid-cols-2 gap-2 mt-3 pt-2 border-t border-gray-100 text-xs text-gray-500">
                            <div>Entrada: <span class="font-medium text-gray-700">${item.entrada}</span></div>
                            <div>Vencimento: <span class="font-medium text-gray-700">${item.vencimento}</span></div>
                            <div class="col-span-2 mt-1.5 text-indigo-700 font-bold bg-indigo-50 p-2 rounded text-center border border-indigo-100">
                                Próxima Troca: ${item.proximaTroca}
                            </div>
                        </div>
                    </div>

                    <button onclick="excluirItem(${item.id})" class="absolute top-3 right-3 text-red-500 hover:text-red-700 text-xs font-bold bg-red-50 hover:bg-red-100 px-2.5 py-1 rounded-lg transition">
                        Excluir
                    </button>
                </div>
            `).join('');
        }

        // Executa assim que a página abre
        window.onload = function() {
            renderizarLista();
        };
    </script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 font-sans">

    <div class="max-w-md mx-auto space-y-4">
        
        <header class="bg-indigo-600 text-white p-4 rounded-2xl shadow-sm text-center">
            <h1 class="text-lg font-bold">Gerenciador de Proteção</h1>
            <p class="text-xs text-indigo-200">Versão Estabilizada Sem Erros</p>
        </header>

        <section class="bg-white p-5 rounded-2xl shadow-xs border border-gray-200">
            <h2 class="text-sm font-bold text-gray-500 uppercase mb-3">Novo Cadastro</h2>
            
            <form id="formEpi" onsubmit="salvarItem(event)" class="space-y-4">
                
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Nome do Item</label>
                    <input type="text" id="nome" required placeholder="Ex: Luva de Raspa, Cone..." class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-indigo-600">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Tipo</label>
                        <select id="tipo" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-indigo-600">
                            <option value="EPI">EPI</option>
                            <option value="EPC">EPC</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Quantidade</label>
                        <input type="number" id="quantidade" min="1" required class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-indigo-600">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Data de Entrada</label>
                        <input type="date" id="dataEntrada" required onchange="calcularProximaTroca()" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-indigo-600">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Data de Vencimento</label>
                        <input type="date" id="dataVencimento" required onchange="calcularProximaTroca()" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-indigo-600">
                    </div>
                </div>

                <div id="containerTroca" class="bg-amber-50 border border-amber-200 p-3 rounded-xl text-center">
                    <span class="block text-[10px] font-bold text-amber-700 uppercase">Sugestão de Próxima Troca</span>
                    <p id="proximaTrocaTexto" class="text-sm font-bold text-amber-950 mt-0.5">Preencha as duas datas...</p>
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold p-3 rounded-xl transition text-sm shadow-sm">
                    Salvar Item
                </button>
            </form>
        </section>

        <section class="space-y-2">
            <h2 class="text-sm font-bold text-gray-500 uppercase px-1">Itens Salvos</h2>
            <div id="listaItens" class="space-y-2">
                </div>
        </section>

    </div>

</body>
</html>
